apiVersion: v1
kind: ConfigMap
metadata:
  name: vigilai-control-api-config
data:
  PORT: "7080"
  STORE_DRIVER: "postgres"
  CONTROL_API_DATA_DIR: "services/control-api/data"
  EVIDENCE_DIR: "edge/edge-agent/data/evidence"
  RATE_LIMIT_WINDOW_MS: "60000"
  RATE_LIMIT_MAX: "240"
  INCIDENT_SLA_MINUTES: "CRITICAL:5,HIGH:15,MEDIUM:60,LOW:240"
---
apiVersion: v1
kind: Secret
metadata:
  name: vigilai-control-api-secrets
type: Opaque
stringData:
  POSTGRES_URL: "postgres://vigilai:vigilai@vigilai-postgres:5432/vigilai"
  DEVICE_KEY_SALT: "replace-this-device-key-salt"
  OPERATOR_JWT_SECRET: "replace-this-with-at-least-32-characters"
  OPERATOR_USERS_JSON: "[]"
  EVIDENCE_ENCRYPTION_KEY: ""
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vigilai-evidence
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vigilai-control-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vigilai-control-api
  template:
    metadata:
      labels:
        app: vigilai-control-api
    spec:
      containers:
        - name: control-api
          image: vigilai/control-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 7080
          envFrom:
            - configMapRef:
                name: vigilai-control-api-config
            - secretRef:
                name: vigilai-control-api-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 7080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 7080
            initialDelaySeconds: 20
            periodSeconds: 20
          volumeMounts:
            - name: evidence
              mountPath: /app/edge/edge-agent/data/evidence
      volumes:
        - name: evidence
          persistentVolumeClaim:
            claimName: vigilai-evidence
---
apiVersion: v1
kind: Service
metadata:
  name: vigilai-control-api
spec:
  selector:
    app: vigilai-control-api
  ports:
    - name: http
      port: 7080
      targetPort: 7080
