apiVersion: v1
kind: Secret
metadata:
  name: vigilai-postgres-secret
type: Opaque
stringData:
  POSTGRES_DB: vigilai
  POSTGRES_USER: vigilai
  POSTGRES_PASSWORD: vigilai
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vigilai-postgres-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vigilai-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vigilai-postgres
  template:
    metadata:
      labels:
        app: vigilai-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: vigilai-postgres-secret
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "vigilai", "-d", "vigilai"]
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: vigilai-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: vigilai-postgres
spec:
  selector:
    app: vigilai-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
