services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: vigilai
      POSTGRES_USER: vigilai
      POSTGRES_PASSWORD: vigilai
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vigilai -d vigilai"]
      interval: 10s
      timeout: 3s
      retries: 5
  control-api:
    build:
      context: ../..
      dockerfile: services/control-api/Dockerfile
    ports:
      - "7080:7080"
    volumes:
      - control-data:/app/services/control-api/data
      - evidence-data:/app/edge/edge-agent/data/evidence
    env_file:
      - ../../.env
    environment:
      PORT: "7080"
      CONTROL_API_DATA_DIR: "services/control-api/data"
      EVIDENCE_DIR: "edge/edge-agent/data/evidence"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7080/health"]
      interval: 15s
      timeout: 3s
      retries: 5
  edge-bridge:
    build:
      context: ../..
      dockerfile: edge/analytics/Dockerfile
    depends_on:
      control-api:
        condition: service_healthy
    volumes:
      - edge-outbox:/app/edge/edge-agent/data/outbox
      - evidence-data:/app/edge/edge-agent/data/evidence
    env_file:
      - ../../.env
    environment:
      CONTROL_API_URL: "http://control-api:7080"
      EDGE_OUTBOX_DIR: "edge/edge-agent/data/outbox"
      EVIDENCE_DIR: "edge/edge-agent/data/evidence"

volumes:
  postgres-data:
  control-data:
  edge-outbox:
  evidence-data:
